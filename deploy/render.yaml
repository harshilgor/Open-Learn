# Free development deployment. Upgrade only when the owner opts into paid compute.
services:
  - type: web
    name: openlearn-api
    runtime: docker
    plan: free
    dockerfilePath: deploy/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.app.hosted_runtime api-free
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - fromGroup: openlearn-production
      - key: OPENLEARN_WORKER_MODE
        value: embedded
      - key: OPENLEARN_MIGRATE_ON_START
        value: 'false'
      - key: AI_TUTOR_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: OPENLEARN_USAGE_PAID_ROUTES_ENABLED
        value: 'true'
      - key: OPENLEARN_PLATFORM_DAILY_BUDGET_USD
        value: '1'
      - key: OPENLEARN_PLATFORM_MONTHLY_BUDGET_USD
        value: '10'
      - key: OPENLEARN_PROVIDER_RATE_VERSION
        value: haiku55-2026-10-07-v1
      - key: OPENLEARN_HAIKU55_INPUT_USD_PER_MILLION
        value: '0.10'
      - key: OPENLEARN_HAIKU55_OUTPUT_USD_PER_MILLION
        value: '0.50'
      - key: OPENLEARN_HAIKU55_CACHE_READ_USD_PER_MILLION
        value: '0.01'
      - key: OPENLEARN_SANDBOX_ENABLED
        value: 'false'
      - key: OPENLEARN_BROWSER_ASSISTANT_ENABLED
        value: 'false'
      - key: OPENLEARN_AGENT_ADMISSION_ENABLED
        value: 'false'
