<!doctype html><html><head><meta charset="utf-8"><title>Open Learn Canvas</title></head><body>
<h1>Connect Canvas</h1><p>Use your signed-in Canvas tab. Paste the pairing configuration from Open Learn. Access is restricted to the chosen institution and courses.</p>
<label>Pairing configuration<textarea id="config" rows="8"></textarea></label>
<button id="pair">Approve and connect</button><button id="sync">Read selected courses</button><button id="disconnect">Disconnect</button>
<p id="status" role="status"></p><script src="popup.js"></script></body></html>
