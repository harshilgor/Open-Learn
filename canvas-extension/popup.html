<!doctype html><html><head><meta charset="utf-8"><title>Open Learn Browser Companion</title></head><body>
<h1>OpenLearn browser companion</h1><p>Paste a website pairing from OpenLearn. Sign in to that website in your browser. The assistant opens its own task tab and reads only approved sites. You can close this popup while it works.</p>
<label>Pairing configuration<textarea id="config" rows="8"></textarea></label>
<button id="pair">Approve and connect</button><button id="sync">Check for tasks / read Canvas</button><button id="disconnect">Disconnect</button>
<p id="status" role="status"></p><script src="popup.js"></script></body></html>
