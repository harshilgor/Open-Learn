name: Platform quality

on:
  pull_request:
    paths: ['backend/**', 'web/**', 'deploy/**', '.github/workflows/platform-*.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'deploy/**', '.github/workflows/platform-*.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AI_TUTOR_PROVIDER: deterministic_baseline
      AI_TUTOR_ENV: development
      OPENLEARN_WORKER_MODE: external
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.scripts.check_release_contract
      - run: python -m backend.scripts.release_workflow_policy
      - run: python -m backend.scripts.actionlint_check
      - run: python -m backend.scripts.check_connection_budget --blueprint deploy/render-paid.yaml
      - name: Backend feature and persistence regressions
        run: >-
          python -m pytest -vv -o faulthandler_timeout=60 backend/tests/test_performance.py backend/tests/test_release_gates.py backend/tests/test_release_preflight.py
          backend/tests/test_migrations.py backend/tests/test_hosted_free_runtime.py
          backend/tests/test_generation_infrastructure.py backend/tests/test_durable_generation_replay.py
          backend/tests/test_live_branching.py backend/tests/test_conversation_admission.py
          backend/tests/test_workspace_notes.py backend/tests/test_mode_transition.py
          backend/tests/test_context_provenance.py backend/tests/test_selected_material_context.py
          backend/tests/test_learner_memory_phase_a.py backend/tests/test_learner_memory_phase_b.py
          backend/tests/test_learner_memory_phase_c.py backend/tests/test_learner_memory_phase_d.py
          backend/tests/test_learner_memory_phase_e.py backend/tests/test_learner_memory_phase_f.py
          backend/tests/test_source_memory_compiler.py
          backend/tests/test_cache.py
      - name: Learner memory evaluation gates (recorded extraction outputs; no provider)
        run: python -m backend.app.evaluation_runner --memory
      - name: Deterministic staging benchmark (not provider latency)
        run: python -m backend.scripts.performance_benchmark --runs 10 --out outputs/performance/ci-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-performance-baseline
          path: outputs/performance/ci-baseline.json
  scheduled-browser-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AI_TUTOR_PROVIDER: deterministic_baseline
      AI_TUTOR_ENV: development
      OPENLEARN_WORKER_MODE: external
      OPENLEARN_SCHEDULED_BROWSER_TEST_DATABASE_URL: postgresql+psycopg://scheduled_test:scheduled_test@127.0.0.1:5432/scheduled_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduled_test
          POSTGRES_PASSWORD: scheduled_test
          POSTGRES_DB: scheduled_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduled_test -d scheduled_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Isolated scheduled-browser recovery and PostgreSQL race checks
        run: python -m pytest -vv -o faulthandler_timeout=60 backend/tests/test_scheduled_browser_jobs.py backend/tests/test_chat_reminders.py
  backend-redis:
    # Cache-aside layer against a real Valkey server (other jobs use fakeredis).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AI_TUTOR_PROVIDER: deterministic_baseline
      AI_TUTOR_ENV: development
      OPENLEARN_WORKER_MODE: external
      OPENLEARN_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Cache-aside regressions against real Redis
        run: python -m pytest -vv -o faulthandler_timeout=60 backend/tests/test_cache.py
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Transport, notes, context, and stream regressions
        run: >-
          npx vitest run tests/tutor-fast-path.test.tsx tests/performance.test.tsx tests/product-service.test.tsx
          tests/account-transport.test.tsx tests/api-loading.test.tsx tests/chat-outbox.test.tsx
          tests/generation-connection.test.tsx tests/generation-activity.test.tsx
          tests/conversation-admission.test.tsx tests/notes-sidebar.test.tsx
          tests/workspace-side-chats.test.tsx tests/compact-tutor-chat.test.tsx tests/release-metadata.test.tsx
          tests/learner-memory.test.tsx tests/learner-memory-settings.test.tsx tests/settings-navigation.test.tsx
      - run: npm run build:production
